<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Double Ratchet Demo</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #00ff00; padding: 20px; line-height: 1.4; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .alice { color: #ff00ff; }
        .bob { color: #00ffff; }
        .system { color: #aaaaaa; }
    </style>
</head>
<body>
    <h1>Double Ratchet Protocol Demo</h1>
    <div id="log"></div>

    <script>
        const logDiv = document.getElementById('log');
        function log(msg, type = 'system') {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(div);
            console.log(msg);
        }

        // --- DOUBLE RATCHET IMPLEMENTATION ---
        const MAX_SKIP = 100;
        const ROOT_KEY_ROTATION_INTERVAL = 50;
        const ENC = new TextEncoder();
        const DEC = new TextDecoder();

        function toB64(buf) {
            let bin = '';
            new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
            return btoa(bin);
        }

        function fromB64(str) {
            return Uint8Array.from(atob(str), c => c.charCodeAt(0)).buffer;
        }

        function concat(...buffers) {
            const total = buffers.reduce((s, b) => s + b.byteLength, 0);
            const out = new Uint8Array(total);
            let offset = 0;
            for (const b of buffers) {
                out.set(new Uint8Array(b), offset);
                offset += b.byteLength;
            }
            return out.buffer;
        }

        async function generateDH() {
            const kp = await crypto.subtle.generateKey(
                { name: 'ECDH', namedCurve: 'P-256' },
                true,
                ['deriveBits']
            );
            const publicRaw = await crypto.subtle.exportKey('raw', kp.publicKey);
            const privateJwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
            return {
                privateKey: kp.privateKey,
                publicKey: kp.publicKey,
                publicB64: toB64(publicRaw),
                privateJwk,
            };
        }

        async function dh(dhPrivate, dhPublic) {
            return crypto.subtle.deriveBits(
                { name: 'ECDH', public: dhPublic },
                dhPrivate,
                256
            );
        }

        async function importPublicKey(b64) {
            return crypto.subtle.importKey(
                'raw', fromB64(b64),
                { name: 'ECDH', namedCurve: 'P-256' },
                true, []
            );
        }

        async function importPrivateKey(jwk) {
            return crypto.subtle.importKey(
                'jwk', jwk,
                { name: 'ECDH', namedCurve: 'P-256' },
                false, ['deriveBits']
            );
        }

        async function kdfRK(rk, dhOut) {
            const key = await crypto.subtle.importKey('raw', rk, 'HKDF', false, ['deriveBits']);
            const derived = await crypto.subtle.deriveBits(
                { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: ENC.encode('VanishText-RK') },
                key, 512
            );
            return {
                rootKey: derived.slice(0, 32),
                chainKey: derived.slice(32, 64),
            };
        }

        async function kdfCK(ck) {
            const key = await crypto.subtle.importKey('raw', ck, 'HKDF', false, ['deriveBits']);
            const derived = await crypto.subtle.deriveBits(
                { name: 'HKDF', hash: 'SHA-256', salt: null, info: ENC.encode('VanishText-CK') },
                key, 512
            );
            return {
                messageKey: derived.slice(0, 32),
                nextChainKey: derived.slice(32, 64),
            };
        }

        async function encryptAESGCM(keyBuf, plaintext, associatedData) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await crypto.subtle.importKey('raw', keyBuf, 'AES-GCM', false, ['encrypt']);
            const ciphertext = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv, tagLength: 128, additionalData: associatedData },
                key,
                ENC.encode(plaintext)
            );
            return { iv: toB64(iv), ciphertext: toB64(ciphertext) };
        }

        async function decryptAESGCM(keyBuf, ivB64, ctB64, associatedData) {
            const key = await crypto.subtle.importKey('raw', keyBuf, 'AES-GCM', false, ['decrypt']);
            const plaintext = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: fromB64(ivB64), tagLength: 128, additionalData: associatedData },
                key,
                fromB64(ctB64)
            );
            return DEC.decode(plaintext);
        }

        class DoubleRatchet {
            constructor(sessionId) {
                this.sessionId = sessionId;
                this.state = null;
            }

            async RatchetInitAlice(SK, bobDHPublicB64) {
                const DHs = await generateDH();
                const DHr = await importPublicKey(bobDHPublicB64);
                const dhOut = await dh(DHs.privateKey, DHr);
                const { rootKey, chainKey } = await kdfRK(SK, dhOut);
                this.state = { RK: rootKey, CKs: chainKey, CKr: null, DHs, DHr, Ns: 0, Nr: 0, PN: 0, MKSKIPPED: new Map(), globalCounter: 0, lastRotation: 0 };
                return this;
            }

            async RatchetInitBob(SK, bobKeyPair) {
                this.state = { RK: SK, CKs: null, CKr: null, DHs: bobKeyPair, DHr: null, Ns: 0, Nr: 0, PN: 0, MKSKIPPED: new Map(), globalCounter: 0, lastRotation: 0 };
                return this;
            }

            async RatchetEncrypt(plaintext, associatedData) {
                const mk = await kdfCK(this.state.CKs);
                const header = { dh: this.state.DHs.publicB64, pn: this.state.PN, n: this.state.Ns };
                const ad = concat(associatedData, ENC.encode(JSON.stringify(header)));
                const ciphertext = await encryptAESGCM(mk.messageKey, plaintext, new Uint8Array(ad));
                this.state.Ns++;
                this.state.globalCounter++;
                this.state.CKs = mk.nextChainKey;
                return { header, ciphertext };
            }

            async RatchetDecrypt(header, ciphertext, associatedData) {
                const ad = concat(associatedData, ENC.encode(JSON.stringify(header)));
                
                // Simplified skip/DH logic for demo
                if (this.state.DHr === null || header.dh !== this.state.DHr.publicB64) {
                    this.state.PN = this.state.Ns;
                    this.state.Ns = 0;
                    this.state.Nr = 0;
                    this.state.DHr = await importPublicKey(header.dh);
                    const dhOut = await dh(this.state.DHs.privateKey, this.state.DHr);
                    const { rootKey, chainKey } = await kdfRK(this.state.RK, dhOut);
                    this.state.RK = rootKey;
                    this.state.CKr = chainKey;
                    this.state.DHs = await generateDH();
                    const dhOut2 = await dh(this.state.DHs.privateKey, this.state.DHr);
                    const { rootKey: rk2, chainKey: ck2 } = await kdfRK(this.state.RK, dhOut2);
                    this.state.RK = rk2;
                    this.state.CKs = ck2;
                }

                const mk = await kdfCK(this.state.CKr);
                this.state.CKr = mk.nextChainKey;
                this.state.Nr++;
                return await decryptAESGCM(mk.messageKey, ciphertext.iv, ciphertext.ciphertext, new Uint8Array(ad));
            }
        }

        async function runDemo() {
            log('Starting Double Ratchet Demo...', 'system');
            
            const bobKeyPair = await generateDH();
            const SK = crypto.getRandomValues(new Uint8Array(32));
            const AD = ENC.encode('VanishText-v1');

            const alice = await new DoubleRatchet('alice').RatchetInitAlice(SK, bobKeyPair.publicB64);
            const bob = await new DoubleRatchet('bob').RatchetInitBob(SK, bobKeyPair);

            log('--- EXCHANGE ---', 'system');

            // Msg 1
            const msg1 = await alice.RatchetEncrypt('Hello Bob!', AD);
            log(`Alice sends: "Hello Bob!" (n=${msg1.header.n})`, 'alice');
            const pt1 = await bob.RatchetDecrypt(msg1.header, msg1.ciphertext, AD);
            log(`Bob receives: "${pt1}"`, 'bob');

            // Msg 2
            const msg2 = await bob.RatchetEncrypt('Hi Alice, I see you!', AD);
            log(`Bob sends: "Hi Alice, I see you!" (n=${msg2.header.n})`, 'bob');
            const pt2 = await alice.RatchetDecrypt(msg2.header, msg2.ciphertext, AD);
            log(`Alice receives: "${pt2}"`, 'alice');

            // Msg 3
            const msg3 = await alice.RatchetEncrypt('Protocol is working!', AD);
            log(`Alice sends: "Protocol is working!" (n=${msg3.header.n})`, 'alice');
            const pt3 = await bob.RatchetDecrypt(msg3.header, msg3.ciphertext, AD);
            log(`Bob receives: "${pt3}"`, 'bob');

            log('--- DEMO COMPLETE ---', 'system');
        }

        runDemo().catch(e => log('ERROR: ' + e.message, 'system'));
    </script>
</body>
</html>
