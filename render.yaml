services:
  - type: web
    name: vanishtext
    env: node
    region: oregon
    plan: free
    buildCommand: ./scripts/build.sh
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # ── Backend (runtime) ──────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false   # Set in Render Dashboard: your Supabase Project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # Set in Render Dashboard: your Supabase Service Role key
      - key: FRONTEND_URL
        value: https://vanish-venx.onrender.com
      # ── Frontend (build-time, baked into JS bundle by expo export) ─
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false   # SAME value as SUPABASE_URL — needed at build time
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false   # Set in Render Dashboard: your Supabase anon/public key
