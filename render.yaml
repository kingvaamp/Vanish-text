services:
  - type: web
    name: vanishtext
    env: node
    region: oregon
    plan: free
    buildCommand: ./scripts/build.sh
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # ── Backend (runtime secrets — set in Render Dashboard) ───────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://vanish-venx.onrender.com
      # ── Frontend (build-time public keys — safe to commit) ────────
      - key: EXPO_PUBLIC_SUPABASE_URL
        value: https://ubjsgwpxkcxdpgfsfyjg.supabase.co
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable__0XmvmW-jjp1VpITIOOe_w_UHKePy78
