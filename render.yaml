services:
  - type: web
    name: vanishtext
    env: node
    region: oregon
    plan: free
    buildCommand: npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false   # Add your Supabase URL here for the server
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # Add your Service Role Key here for the server
      - key: FRONTEND_URL
        value: https://vanish-venx.onrender.com
